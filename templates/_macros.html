{% macro stars(value) -%}
  {%- set full = (value or 0) | round | int -%}
  <span class="stars" aria-label="{{ '%.1f' % (value or 0) }} out of 5 stars">
    {%- for i in range(1, 6) -%}{% if i <= full %}★{% else %}<span class="off">★</span>{% endif %}{%- endfor -%}
  </span>
{%- endmacro %}

{% macro price(level) -%}
  <span title="Price level {{ level }} of 3">{{ '$' * level }}</span>
{%- endmacro %}
