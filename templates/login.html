{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Log in</h1>
  <form class="form" method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input type="text" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="small muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
</section>
{% endblock %}
